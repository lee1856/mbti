<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4eee4" />
  <meta name="description" content="10개의 질문으로 나의 커리어 페르소나를 발견하는 성향 진단 테스트" />
  <title>Career Style Lab | 나의 커리어 페르소나</title>
  <style>
    :root {
      --ink: #332c26;
      --muted: #81756a;
      --line: #e6dbcc;
      --paper: #fffdf9;
      --canvas: #f4eee4;
      --beige: #e8dccb;
      --beige-deep: #d5c1a8;
      --coffee: #6c513d;
      --coffee-dark: #4c392c;
      --terra: #b87955;
      --olive: #78836d;
      --soft: #f8f3eb;
      --shadow: 0 22px 60px rgba(82, 62, 43, .10);
      --radius: 26px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 18px 46px;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, rgba(211,190,164,.25), transparent 27rem),
        radial-gradient(circle at 95% 15%, rgba(185,121,85,.09), transparent 24rem),
        var(--canvas);
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
      line-height: 1.65;
    }
    button { font: inherit; }
    .shell { width: min(1080px, 100%); margin: 0 auto; }
    .topline { display:flex; justify-content:space-between; align-items:center; margin:0 5px 17px; color:#817568; font-size:11px; font-weight:850; letter-spacing:.16em; text-transform:uppercase; }
    .brand { display:flex; align-items:center; gap:10px; color:var(--coffee-dark); }
    .brand-mark { width:30px; height:30px; display:grid; place-items:center; border-radius:11px; color:#fffaf3; background:var(--coffee); font-size:14px; font-weight:900; letter-spacing:0; }
    .top-note { letter-spacing:0; text-transform:none; font-size:12px; font-weight:650; }
    .app-card { overflow:hidden; border:1px solid rgba(221,207,189,.82); border-radius:var(--radius); background:var(--paper); box-shadow:var(--shadow); }

    /* Hero: PC에서는 텍스트와 일러스트 2단, 모바일에서는 1단으로 배치 */
    .hero { padding:clamp(30px, 5vw, 60px); background:linear-gradient(135deg, #fbf7ef 0%, #f1e7d9 100%); }
    .hero-layout { display:grid; grid-template-columns:minmax(0, .92fr) minmax(0, 1.08fr); align-items:center; gap:clamp(26px, 4vw, 54px); }
    .hero-copy-wrap { max-width:490px; }
    .eyebrow { display:inline-flex; align-items:center; gap:9px; margin-bottom:17px; color:#9a6e4c; font-size:11px; font-weight:900; letter-spacing:.17em; }
    .eyebrow::before { content:""; width:24px; height:1.5px; background:#b87955; }
    h1 { margin:0; font-size:clamp(34px, 4.4vw, 53px); line-height:1.2; letter-spacing:-.055em; font-weight:850; }
    .hero-intro { margin:19px 0 0; color:#76685b; font-size:15px; line-height:1.85; word-break:keep-all; }
    .hero-bottom { display:flex; align-items:center; flex-wrap:wrap; gap:17px; margin-top:29px; }
    .hero-meta { display:flex; align-items:center; gap:8px; color:#928477; font-size:12px; font-weight:700; }
    .meta-dot { width:5px; height:5px; border-radius:50%; background:#b87955; }
    .hero-visual { position:relative; min-width:0; }
    .hero-visual::before { content:""; position:absolute; inset:7% 4% 1%; border-radius:47% 47% 25px 25px; background:rgba(221,204,181,.44); transform:rotate(2deg); }
    .hero-image { position:relative; display:block; width:100%; aspect-ratio: 1.57 / 1; object-fit:cover; object-position:center 48%; border:1px solid rgba(255,255,255,.8); border-radius:22px; box-shadow:0 17px 40px rgba(92,69,46,.13); }
    .primary-btn, .secondary-btn { display:inline-flex; justify-content:center; align-items:center; gap:10px; min-height:49px; padding:0 22px; border:0; border-radius:13px; cursor:pointer; font-weight:800; transition:transform .18s ease, box-shadow .18s ease, background .18s ease; }
    .primary-btn { color:#fffaf4; background:var(--coffee); box-shadow:0 7px 18px rgba(91,67,47,.18); }
    .primary-btn:hover { transform:translateY(-2px); background:var(--coffee-dark); box-shadow:0 11px 23px rgba(91,67,47,.22); }
    .secondary-btn { color:#665646; border:1px solid #dfd2c1; background:#fffdf9; }
    .secondary-btn:hover { background:#f7f0e7; }
    button:focus-visible { outline:3px solid rgba(184,121,85,.42); outline-offset:3px; }

    .quiz { padding:clamp(26px, 5vw, 53px) clamp(23px, 6vw, 68px) 48px; }
    .quiz-top { display:flex; justify-content:space-between; align-items:center; gap:15px; margin-bottom:14px; }
    .step-label { color:#8e8175; font-size:12px; font-weight:850; letter-spacing:.1em; }
    .step-label strong { color:var(--coffee-dark); }
    .axis-label { padding:6px 12px; border-radius:99px; color:#806a56; background:#f3ece2; font-size:11px; font-weight:750; }
    .progress-track { overflow:hidden; height:6px; border-radius:99px; background:#eee7dd; }
    .progress-fill { width:10%; height:100%; border-radius:99px; background:linear-gradient(90deg, #9a7152, #c89b72); transition:width .3s ease; }
    .question-area { min-height:155px; padding:43px 0 24px; }
    .question-kicker { margin-bottom:12px; color:#aa7c58; font-size:11px; font-weight:900; letter-spacing:.16em; }
    .question-title { max-width:760px; margin:0; font-size:clamp(23px, 3.3vw, 31px); line-height:1.45; letter-spacing:-.04em; word-break:keep-all; }
    .options { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .option { position:relative; display:flex; flex-direction:column; justify-content:flex-start; min-height:144px; padding:21px 22px; text-align:left; border:1.5px solid #e7ddd0; border-radius:18px; color:var(--ink); background:#fffefa; cursor:pointer; transition:border-color .18s ease, background .18s ease, transform .18s ease, box-shadow .18s ease; }
    .option:hover { transform:translateY(-2px); border-color:#cdb79f; box-shadow:0 10px 24px rgba(83,62,43,.07); }
    .option.selected { border-color:#a97a55; background:#fbf4eb; box-shadow:0 0 0 3px rgba(169,122,85,.12); }
    .option-letter { display:grid; place-items:center; width:27px; height:27px; margin-bottom:14px; border-radius:9px; color:#846b54; background:#f0e8dd; font-size:11px; font-weight:900; }
    .option.selected .option-letter { color:#fff; background:#a77a55; }
    .option-text { display:block; padding-right:22px; font-size:15px; line-height:1.65; font-weight:750; letter-spacing:-.025em; word-break:keep-all; }
    .option-check { position:absolute; top:21px; right:20px; width:19px; height:19px; border:1.5px solid #dfd4c7; border-radius:50%; }
    .option.selected .option-check { border:5px solid #a77a55; }
    .quiz-footer { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:28px; }
    .quiz-footer .primary-btn:disabled { opacity:.42; cursor:not-allowed; transform:none; box-shadow:none; }

    .result { padding:0 clamp(23px, 5.7vw, 62px) 48px; }
    .result-topline { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:22px 0 16px; color:#938578; font-size:11px; font-weight:750; }
    .saved-mark { display:inline-flex; align-items:center; gap:6px; padding:6px 10px; border-radius:99px; color:#65745b; background:#edf0e8; }
    .result-hero { display:grid; grid-template-columns:minmax(220px, .78fr) minmax(0, 1.22fr); align-items:center; gap:clamp(22px, 4vw, 45px); padding:26px; border:1px solid #e7dbcb; border-radius:22px; background:linear-gradient(135deg, #faf5ed, #f2e8dc); }
    .persona-art { overflow:hidden; width:100%; max-width:300px; margin:0 auto; border-radius:20px; background:#e9dfd2; box-shadow:0 10px 26px rgba(89,65,43,.10); }
    .persona-art svg { display:block; width:100%; height:auto; }
    .result-info { min-width:0; }
    .result-overline { color:#9d7556; font-size:11px; font-weight:900; letter-spacing:.16em; }
    .persona-alias { margin:12px 0 0; color:#957354; font-size:14px; font-weight:800; }
    .result-title { margin:2px 0 8px; font-size:clamp(30px, 4vw, 42px); line-height:1.25; letter-spacing:-.05em; }
    .result-tagline { margin:0; color:#67594d; font-size:15px; line-height:1.8; word-break:keep-all; }
    .result-description { margin:18px 0 0; color:#76695e; font-size:13px; line-height:1.9; word-break:keep-all; }
    .result-section { margin-top:28px; }
    .section-title { display:flex; align-items:center; gap:10px; margin:0 0 14px; font-size:16px; letter-spacing:-.03em; }
    .section-title::before { content:""; width:4px; height:17px; border-radius:3px; background:#b87955; }
    .role-grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:11px; }
    .role-card { min-height:92px; display:flex; flex-direction:column; justify-content:center; padding:17px 16px; border:1px solid #e9dfd3; border-radius:15px; background:#fffdf9; }
    .role-number { color:#b18d6b; font-size:10px; font-weight:900; letter-spacing:.12em; }
    .role-name { margin-top:5px; color:#554638; font-size:14px; font-weight:800; letter-spacing:-.02em; }
    .trait-list { display:flex; flex-wrap:wrap; gap:8px; }
    .trait-pill { padding:8px 12px; border:1px solid #e6ddd1; border-radius:99px; color:#6f6052; background:#f9f5ef; font-size:12px; font-weight:700; }
    .growth-box { padding:17px 19px; border:1px solid #e9dfd3; border-left:4px solid #9c876a; border-radius:0 14px 14px 0; background:#faf7f1; }
    .growth-box p { margin:0; color:#6d6053; font-size:13px; line-height:1.85; }
    .result-disclaimer { margin:22px 0 0; color:#a09589; font-size:11px; line-height:1.75; }
    .result-actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:25px; }
    .result-actions .primary-btn, .result-actions .secondary-btn { min-height:45px; font-size:13px; }
    .result-actions .primary-btn { background:#876247; }

    .hidden { display:none !important; }
    .fade-in { animation:fadeIn .35s ease both; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(7px); } to { opacity:1; transform:translateY(0); } }
    .toast { position:fixed; left:50%; bottom:25px; z-index:10; transform:translate(-50%, 15px); opacity:0; max-width:calc(100vw - 30px); padding:11px 16px; border-radius:99px; color:#fffaf4; background:#4c392c; box-shadow:0 8px 25px rgba(0,0,0,.16); font-size:12px; pointer-events:none; transition:all .25s ease; text-align:center; }
    .toast.show { opacity:1; transform:translate(-50%, 0); }
    .footer-note { margin:14px 4px 0; text-align:center; color:#a69a8c; font-size:11px; }
    @media (max-width: 760px) {
      body { padding:14px 10px 28px; }
      .topline { margin:0 3px 12px; }
      .top-note { font-size:10px; }
      .hero { padding:28px 23px 24px; }
      .hero-layout { grid-template-columns:1fr; gap:22px; }
      .hero-copy-wrap { max-width:none; }
      h1 { font-size:clamp(32px, 8vw, 43px); }
      .hero-intro { margin-top:12px; font-size:13px; }
      .hero-bottom { margin-top:20px; gap:12px; }
      .hero-bottom .primary-btn { min-height:45px; }
      .hero-visual { width:100%; }
      .hero-image { aspect-ratio:1.65 / 1; border-radius:16px; }
      .quiz { padding:27px 22px 30px; }
      .question-area { min-height:130px; padding:32px 0 20px; }
      .options { grid-template-columns:1fr; gap:10px; }
      .option { min-height:100px; padding:16px 17px; }
      .option-letter { margin-bottom:8px; }
      .quiz-footer { margin-top:21px; }
      .quiz-footer button { min-height:44px; padding:0 16px; }
      .result { padding:0 18px 30px; }
      .result-hero { grid-template-columns:1fr; gap:20px; padding:17px; }
      .persona-art { max-width:250px; }
      .result-info { text-align:center; }
      .result-section { margin-top:24px; }
      .role-grid { grid-template-columns:1fr; gap:8px; }
      .role-card { min-height:70px; padding:12px 15px; }
      .result-actions { display:grid; grid-template-columns:1fr 1fr; }
      .result-actions button:first-child { grid-column:1 / -1; }
    }
    @media (max-width: 390px) {
      .brand { font-size:10px; }
      .top-note { max-width:110px; text-align:right; }
      .hero-bottom { align-items:flex-start; flex-direction:column; }
      .hero-bottom .primary-btn { width:100%; }
      .result-actions { grid-template-columns:1fr; }
      .result-actions button:first-child { grid-column:auto; }
    }
    @media print {
      body { padding:0; background:#fff; }
      .topline, .footer-note, .result-actions, .toast { display:none !important; }
      .app-card { border:0; box-shadow:none; }
      .result { padding-bottom:0; }
      .result-hero, .role-card, .growth-box { print-color-adjust:exact; -webkit-print-color-adjust:exact; }
    }
  </style>
</head>

  <main class="shell">
    <div class="topline">
      <div class="brand"><span class="brand-mark">C</span><span>나의 커리어테스트</span></div>

    </div>

    const introScreen = document.getElementById('introScreen');
    const quizScreen = document.getElementById('quizScreen');
    const resultScreen = document.getElementById('resultScreen');
    const currentNum = document.getElementById('currentNum');
    const axisLabel = document.getElementById('axisLabel');
    const questionKicker = document.getElementById('questionKicker');
    const questionTitle = document.getElementById('questionTitle');
    const optionsEl = document.getElementById('options');
    const progressFill = document.getElementById('progressFill');
    const progressBar = document.getElementById('progressBar');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    let currentIndex = 0;
    let answers = Array(questions.length).fill(null);

    document.getElementById('startBtn').addEventListener('click', () => {
      introScreen.classList.add('hidden');
      resultScreen.classList.add('hidden');
      quizScreen.classList.remove('hidden');
      currentIndex = 0;
      answers = Array(questions.length).fill(null);
      renderQuestion();
      window.scrollTo({ top:0, behavior:'smooth' });
    });

    function renderQuestion() {
      const q = questions[currentIndex];
      currentNum.textContent = String(currentIndex + 1).padStart(2, '0');
      axisLabel.textContent = q.axis;
      questionKicker.textContent = q.kicker;
      questionTitle.textContent = q.title;
      const progress = ((currentIndex + 1) / questions.length) * 100;
      progressFill.style.width = progress + '%';
      progressBar.setAttribute('aria-valuenow', Math.round(progress));
      optionsEl.innerHTML = '';
      [q.a, q.b].forEach((label, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'option' + (answers[currentIndex] === index ? ' selected' : '');
        button.setAttribute('aria-pressed', answers[currentIndex] === index ? 'true' : 'false');
        button.innerHTML = `<span class="option-letter">${index === 0 ? 'A' : 'B'}</span><span class="option-text"></span><span class="option-check" aria-hidden="true"></span>`;
        button.querySelector('.option-text').textContent = label;
        button.addEventListener('click', () => selectAnswer(index));
        optionsEl.appendChild(button);
      });
      prevBtn.disabled = currentIndex === 0;
      prevBtn.style.opacity = currentIndex === 0 ? '.42' : '1';
      nextBtn.disabled = answers[currentIndex] === null;
      nextBtn.innerHTML = currentIndex === questions.length - 1 ? '결과 확인하기 <span aria-hidden="true">→</span>' : '다음 문항 <span aria-hidden="true">→</span>';
      const area = document.getElementById('questionArea');
      area.classList.remove('fade-in');
      void area.offsetWidth;
      area.classList.add('fade-in');
    }

    function selectAnswer(index) {
      answers[currentIndex] = index;
      [...optionsEl.children].forEach((el, i) => {
        el.classList.toggle('selected', i === index);
        el.setAttribute('aria-pressed', i === index ? 'true' : 'false');
      });
      nextBtn.disabled = false;
    }

    nextBtn.addEventListener('click', () => {
      if (answers[currentIndex] === null) return;
      if (currentIndex < questions.length - 1) {
        currentIndex++;
        renderQuestion();
      } else {
        completeTest();
      }
      window.scrollTo({ top:0, behavior:'smooth' });
    });

    prevBtn.addEventListener('click', () => {
      if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
      }
    });

    function calculateResult() {
      const counts = { logic:0, idea:0, solo:0, team:0 };
      questions.forEach((q, i) => {
        const isA = answers[i] === 0;
        if (q.key === 'thinking') counts[isA ? 'logic' : 'idea']++;
        if (q.key === 'working') counts[isA ? 'solo' : 'team']++;
      });
      const thinkingType = counts.logic >= 3 ? 'logic' : 'idea';
      const workingType = counts.solo >= 3 ? 'solo' : 'team';
      return { profileKey:`${thinkingType}-${workingType}`, counts, completedAt:new Date().toISOString() };
    }

    function completeTest() {
      const result = calculateResult();
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(result));
      } catch (error) {
        console.warn('결과를 로컬 스토리지에 저장하지 못했습니다.', error);
      }
      renderResult(result, false);
    }

        <p class="result-disclaimer">※ 이 결과는 10개 문항에 대한 자기보고식 응답을 바탕으로 구성한 커리어 탐색용 참고 정보입니다. 특정 직무의 적합성이나 업무 성과를 판정하는 전문 심리검사는 아닙니다.</p>
        <div class="result-actions">
          <button class="primary-btn" id="copyResultBtn">결과 복사 <span aria-hidden="true">▣</span></button>
          <button class="secondary-btn" id="restartBtn">다시 진단하기 ↻</button>
          <button class="secondary-btn" id="printBtn">인쇄하기</button>
        </div>
      `;
      introScreen.classList.add('hidden');
      quizScreen.classList.add('hidden');
      resultScreen.classList.remove('hidden');
      document.getElementById('copyResultBtn').addEventListener('click', () => copyResult(profile));
      document.getElementById('restartBtn').addEventListener('click', restartTest);
      document.getElementById('printBtn').addEventListener('click', () => window.print());
      window.scrollTo({ top:0, behavior:'smooth' });
    }

    function restartTest() {
      currentIndex = 0;
      answers = Array(questions.length).fill(null);
      resultScreen.classList.add('hidden');
      introScreen.classList.remove('hidden');
      window.scrollTo({ top:0, behavior:'smooth' });
    }

    async function copyResult(profile) {
      const text = [
        `나의 커리어 페르소나: ${profile.name} (${profile.alias})`,
        profile.tagline,
        `추천 직무: ${profile.roles.join(' · ')}`,
        `강점 키워드: ${profile.traits.join(' · ')}`,
        `성장 포인트: ${profile.growth}`
      ].join('\n');
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const area = document.createElement('textarea');
          area.value = text;
          area.setAttribute('readonly', '');
          area.style.position = 'fixed';
          area.style.opacity = '0';
          document.body.appendChild(area);
          area.select();
          const copied = document.execCommand('copy');
          area.remove();
          if (!copied) throw new Error('copy failed');
        }
        showToast('커리어 페르소나 결과를 복사했습니다.');
      } catch (error) {
        showToast('복사할 수 없습니다. 브라우저 권한을 확인해 주세요.');
      }
    }

    let toastTimer;
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
    }

    // 저장된 결과가 있으면 새로 열었을 때 테스트 시작 화면 대신 마지막 결과를 먼저 보여줍니다.
    function restoreSavedResult() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const saved = JSON.parse(raw);
        if (saved && profiles[saved.profileKey]) renderResult(saved, true);
      } catch (error) {
        console.warn('저장된 결과를 불러오지 못했습니다.', error);
      }
    }

    restoreSavedResult();
  </script>
</body>
</html>
